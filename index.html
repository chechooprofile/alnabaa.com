<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALNABAA WEB</title>
    <!-- استدعاء مكتبة الأيقونات الاحترافية لتغيير شكل الإنستغرام للويب -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #5c6bc0, #3949ab, #283593) !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        /* 🚀 حجم اللوجو الجديد والمكبر بوضوح كبيييير */
        .logo-img {
            width: 180px !important; 
            height: 180px !important;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            color: #222;
            margin: 15px 0 5px 0;
            font-weight: 800;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); }
        .btn-store { background: linear-gradient(135deg, #e52d27, #b31217); }

        .btn-link:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .social-footer {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 30px;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 20px;
        }

        .social-icon {
            color: #555;
            font-size: 22px;
            transition: all 0.3s ease;
        }
        .icon-instagram:hover { color: #E1306C; }
        .icon-tiktok:hover { color: #010101; }
        .icon-telegram:hover { color: #0088cc; }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- استدعاء اللوجو -->
        <img src="alnabaa_logo_full_58640422.svg" alt="Alnabaa Logo" class="logo-img">
        
        <h1>WELCOME TO ALNABAA</h1>
        <div class="subtitle">اهلا بكم في النبع 👋</div>
        
        <div class="links-container">
            <a href="https://wa.me/9647837722993" target="_blank" class="btn-link btn-whatsapp">
                <i class="fab fa-whatsapp" style="font-size: 20px;"></i>
                تواصل معنا عبر WhatsApp
            </a>
            
            <!-- 🚀 هنا تم تغيير الأيقونة رسمياً للكرة الأرضية (ويب) والنص لموقعنا الإلكتروني -->
            <a href="https://instagram.com/3chechoo" target="_blank" class="btn-link btn-store">
                <i class="fas fa-globe" style="font-size: 20px;"></i>
                زيارة موقعنا الإلكتروني
            </a>
        </div>
        
        <div class="social-footer">
            <a href="https://instagram.com/3chechoo" target="_blank" class="social-icon icon-instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" class="social-icon icon-tiktok"><i class="fab fa-tiktok"></i></a>
            <a href="#" target="_blank" class="social-icon icon-telegram"><i class="fab fa-telegram"></i></a>
        </div>
    </div>

</body>
</html>
